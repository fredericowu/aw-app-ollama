name: Security scan

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "53 3 * * 3"
  workflow_dispatch: {}

jobs:
  security-scan:
    uses: fredericowu/aw-shared-workflows/.github/workflows/security-scan-reusable.yml@master
    with:
      runs_on: '"ubuntu-latest"'
      sarif_upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read
      contents: read
      security-events: write
