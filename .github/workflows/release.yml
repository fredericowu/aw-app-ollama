name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q && ruff check .
      - name: Read deliberately versioned image reference
        id: image
        run: python -c "import json; print('ref='+json.load(open('aw-app.json'))['runtime']['image'])" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
