name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q && ruff check .
      - name: Read deliberately versioned image reference
        id: image
        run: python -c "import json; print('ref='+json.load(open('aw-app.json'))['runtime']['image'])" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The image ref lives in the tekflox package namespace, which is not
          # linked to this (transferred) repo, so GITHUB_TOKEN gets
          # "permission_denied: The requested installation does not exist".
          # GHCR_PAT (write:packages on ghcr.io/tekflox/aw-app-ollama) is used
          # when set; GITHUB_TOKEN stays as the fallback.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: container
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
